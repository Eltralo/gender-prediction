[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gender-pred"
version = "1.0.0"
description = "Client gender prediction from card transaction sequences"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eltralo", email = "168912313+Eltralo@users.noreply.github.com" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "torch>=2.7",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
tabpfn = ["tabpfn>=2.0"]
compare = ["xgboost>=2.0", "catboost>=1.2"]
dev = ["ruff>=0.6", "jupyter", "ipykernel", "nbconvert"]

[project.scripts]
gender-pred = "gender_pred.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["B905", "E731"]
